# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: ScanToQuote
options:
  bundleIdPrefix: com.scantoquote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ScanCore:
    path: ScanCore
targets:
  ScanToQuote:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ScanCore
    settings:
      base:
        PRODUCT_NAME: ScanToQuote
        PRODUCT_BUNDLE_IDENTIFIER: com.scantoquote.app
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
