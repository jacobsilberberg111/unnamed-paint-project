name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: ScanCore tests
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ScanCore

  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ScanToQuote.xcodeproj \
            -scheme ScanToQuote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScanToQuote.xcarchive" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # Ad-hoc sign so the binary carries a code signature that sideloaders
      # (iloader, Sideloadly, AltStore) can replace; fully unsigned builds fail
      # on device with "integrity could not be verified".
      - name: Ad-hoc sign
        run: |
          APP="$RUNNER_TEMP/ScanToQuote.xcarchive/Products/Applications/ScanToQuote.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ScanToQuote.xcarchive/Products/Applications/ScanToQuote.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/ScanToQuote.ipa" Payload
          ls -lh "$RUNNER_TEMP/ScanToQuote.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ScanToQuote-ipa
          path: ${{ runner.temp }}/ScanToQuote.ipa
          retention-days: 30
